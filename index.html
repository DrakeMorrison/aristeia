<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aristeia</title>
<style>
  :root {
    --bg: #faf8f4; --fg: #1c1a17; --muted: #6b675f; --card: #ffffff;
    --border: #e4e0d8; --accent: #8a6d1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14130f; --fg: #e8e4da; --muted: #9a958a; --card: #1e1c17;
      --border: #32302a; --accent: #d4b45a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.55 Georgia, 'Times New Roman', serif;
    display: flex; min-height: 100vh; justify-content: center;
  }
  main { max-width: 40rem; padding: 3rem 1.25rem 4rem; width: 100%; }
  h1 { font-size: 2.2rem; margin: 0; letter-spacing: 0.02em; }
  h1 + p { margin-top: 0.4rem; color: var(--muted); font-style: italic; }
  .motto { color: var(--accent); }
  ul { list-style: none; padding: 0; margin: 2.5rem 0 0; display: grid; gap: 0.9rem; }
  a.app {
    display: block; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 1rem 1.2rem; text-decoration: none; color: inherit;
    transition: border-color 0.15s;
  }
  a.app:hover { border-color: var(--accent); }
  a.app strong { font-size: 1.15rem; }
  a.app span { display: block; color: var(--muted); font-size: 0.95rem; margin-top: 0.15rem; }
  footer { margin-top: 3rem; color: var(--muted); font-size: 0.85rem; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Aristeia</h1>
  <p>ἀριστεία — <span class="motto">αἰὲν ἀριστεύειν</span>, ever to excel</p>
  <ul>
    <li><a class="app" href="meridian/"><strong>meridian</strong><span>time tracking &amp; prediction calibration</span></a></li>
    <li><a class="app" href="gnomon/"><strong>gnomon</strong><span>one-tap timestamped activity log</span></a></li>
    <li><a class="app" href="pharmakon/"><strong>pharmakon</strong><span>stimulant-cycling tracker</span></a></li>
    <li><a class="app" href="halteres/"><strong>halteres</strong><span>Simple &amp; Sinister kettlebell log</span></a></li>
    <li><a class="app" href="nbacking/"><strong>nbacking</strong><span>dual n-back working memory training</span></a></li>
  </ul>
  <footer><a href="https://github.com/DrakeMorrison/aristeia">source on GitHub</a></footer>
</main>
</body>
</html>
